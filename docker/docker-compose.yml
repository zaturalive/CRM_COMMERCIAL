# ============================================================================
# docker-compose.yml — LOCAL DEV UNIQUEMENT
# Pas de Traefik. Ports exposes directement (3301, 4100, 5432 interne).
# Ports decales pour eviter conflit avec crm-chirurgien (3200) et autres
# services dev locaux (autofront sur 3300). Pour prod : docker-compose.prod.yml
#
# node_modules : construit DANS l'image (npm ci au build), jamais bind-monte
# depuis l'hote. Le user des conteneurs dev est aligne sur l'hote via
# HOST_UID/HOST_GID (defaut 1000) -> aucun fichier root:root dans les mounts.
# Si tu changes une dependance : `docker compose -f docker/docker-compose.yml up --build`.
# ============================================================================

name: crm-commercial

services:
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: crm-commercial-frontend
    # Port 3301 cote hote (3300 = autofront, 3200 = crm-chirurgien, 3100 = Loki).
    # Cote container : Next.js ecoute 3000, pas de changement interne.
    ports:
      - "3301:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4100}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3301}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      # EP14-S03 : cookie de session partage apex <-> sous-domaines (valeur dans .env)
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_DEMO_MODE=${NEXT_PUBLIC_DEMO_MODE:-true}
      - NEXT_PUBLIC_TENANT_SLUG=${NEXT_PUBLIC_TENANT_SLUG:-cabinet-test}
      - NEXT_PUBLIC_DEFAULT_TENANT=${NEXT_PUBLIC_DEFAULT_TENANT:-cabinet-delobaux}
      # Connexion Google (SSO) : client OAuth (NextAuth GoogleProvider) + secret
      # partage serveur-a-serveur. Valeurs dans .env (racine). Absents -> bouton
      # Google inactif, login mot de passe inchange.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_SSO_SHARED_SECRET=${GOOGLE_SSO_SHARED_SECRET:-}
    volumes:
      - ../apps/frontend:/app/apps/frontend
      # Volume anonyme pour .next (evite pollution hot-reload de l'hote)
      - /app/apps/frontend/.next
    networks:
      - crm-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    container_name: crm-commercial-backend
    # EP14-S05 : AT_REST_KEY + EMAIL_SEARCH_KEY proviennent de apps/backend/.env.
    # Les variables du bloc environment ci-dessous gardent la priorite (override).
    env_file:
      - ../apps/backend/.env
    ports:
      - "4100:4000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev}@postgres:5432/${POSTGRES_DB:-crm_commercial}
      # JWT_SECRET vient de env_file (apps/backend/.env) : pas d override ${...} qui se vide hors shell.
      - JWT_EXPIRES_IN=7d
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3301}
      - UPLOADS_DIR=/app/uploads
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Email dev via Mailpit (SMTP interne mailpit:1025, UI sur :8025). Provider
      # changeable par env (MAIL_PROVIDER=smtp|noop).
      - MAIL_PROVIDER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_FROM=no-reply@vencor-crm.localhost
      # Connexion Google (SSO) : secret partage pour valider l'echange depuis le
      # serveur NextAuth (POST /api/auth/google). Valeur dans .env (racine).
      - GOOGLE_SSO_SHARED_SECRET=${GOOGLE_SSO_SHARED_SECRET:-}
    volumes:
      - ../apps/backend:/app/apps/backend
      # node_modules vient de l'image (npm ci au build) : NI bind-mount hote, NI
      # volume anonyme (les deux masqueraient le node_modules de l'image, hoiste
      # a /app/node_modules). Rebuild l'image si tu changes une dependance.
      # @crm/shared : src bind-montee pour le hot-reload (resolu via export
      # "development"). Maintenant dimitry-owned, plus de root:root.
      - ../packages/shared:/app/packages/shared
      - backend_uploads:/app/uploads
    networks:
      - crm-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: crm-commercial-postgres
    # Pas de port host expose : les containers parlent via le reseau crm-network
    # (DATABASE_URL=postgresql://...@postgres:5432/...). Si besoin d'un client
    # externe (dbeaver/psql sur l'hote), `docker exec crm-commercial-postgres
    # psql -U postgres crm_commercial` ou ouvrir un mapping ad-hoc.
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_commercial}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-crm_commercial}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Mailpit : serveur SMTP local de test + UI web. Capture les mails (liens de
  # reset / set-password) sans envoi externe. UI : http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: crm-commercial-mailpit
    ports:
      - "8025:8025"
    networks:
      - crm-network
    restart: unless-stopped

networks:
  # Network nomme (pas le default de compose) pour permettre a des outils
  # externes (webdb, pgAdmin, etc.) de s'y connecter depuis un autre compose.
  # Usage : docker network connect crm-commercial-network <container>
  crm-network:
    name: crm-commercial-network
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
