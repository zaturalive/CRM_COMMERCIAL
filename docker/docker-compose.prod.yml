# ============================================================================
# docker-compose.prod.yml — PROD Scaleway + Traefik (vencor-crm.com)
#
# Prerequis serveur (portes par la session vencor-infra) :
#   - Traefik avec entrypoint websecure (443) + certresolver Let's Encrypt.
#   - Reseau Docker externe PARTAGE avec Traefik : traefik-public
#       (deja cree par l'infra ; sinon : docker network create traefik-public)
#   - Middlewares Traefik file-provider : secure-public-waf-app@file
#       (CrowdSec bouncer + security-headers + rate-limit).
#
# Securite :
#   - Images non-root (Dockerfile USER nodejs/nextjs 1001).
#   - no-new-privileges + cap_drop ALL (cap_add minimal pour Postgres).
#   - read_only rootfs + tmpfs (frontend/backend) ; Postgres ecrit dans son volume.
#   - Limits CPU/RAM/PIDs + logs bornes.
#   - VALIDER AU REDEPLOIEMENT : generation PDF (Puppeteer/Chromium, backend) et
#     boot Postgres (cap_add) — cf checklist guide. read_only/caps faciles a
#     retirer service par service si un write legitime casse.
#
# Lancement :
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
# ============================================================================

name: crm-commercial

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      target: prod
      # NEXT_PUBLIC_* sont inlinees dans le bundle au build (pas runtime).
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-}
    container_name: crm-commercial-frontend
    hostname: crm-commercial-frontend
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BACKEND_URL=http://backend:4000
      - NEXT_PUBLIC_DEMO_MODE=${NEXT_PUBLIC_DEMO_MODE:-false}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
    networks:
      - internal
      - traefik-public
    depends_on:
      - backend
    # ── Hardening ────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      # Next standalone ecrit son cache runtime ici (ISR/revalidate).
      - /app/apps/frontend/.next/cache
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    logging: *default-logging
    labels:
      - "traefik.docker.network=traefik-public"
      - "traefik.enable=true"
      # HTTP (port 80) -> redirige vers HTTPS via la conf statique Traefik.
      - "traefik.http.routers.crm-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.crm-frontend.entrypoints=web"
      - "traefik.http.services.crm-frontend.loadbalancer.server.port=3000"
      # HTTPS (port 443)
      - "traefik.http.routers.crm-frontend-secure.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.crm-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend-secure.service=crm-frontend"
      # X-Forwarded-Proto (app) + chaine WAF infra (CrowdSec + headers + rate-limit)
      - "traefik.http.routers.crm-frontend-secure.middlewares=crm-frontend-headers,secure-public-waf-app@file"
      - "traefik.http.middlewares.crm-frontend-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      # /api/auth/* servi par Next (NextAuth), pas par Express. PathPrefix plus long -> priorite.
      - "traefik.http.routers.crm-frontend-auth-secure.rule=Host(`${DOMAIN}`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.crm-frontend-auth-secure.entrypoints=websecure"
      - "traefik.http.routers.crm-frontend-auth-secure.service=crm-frontend"
      - "traefik.http.routers.crm-frontend-auth-secure.middlewares=secure-public-waf-app@file"

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: prod
    container_name: crm-commercial-backend
    hostname: crm-commercial-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - PORT=4000
      - FRONTEND_URL=${FRONTEND_URL}
      - DOMAIN=${DOMAIN}
      # DEMO_MODE : active /api/demo (role switcher) tant que vitrine.
      - DEMO_MODE=${DEMO_MODE:-false}
      - UPLOADS_DIR=/app/uploads
      - LOG_LEVEL=warn
      # Email prod via Brevo (SMTP).
      - MAIL_PROVIDER=${MAIL_PROVIDER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp-relay.brevo.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      # Chiffrement at-rest (ADR-0009) — OBLIGATOIRE : sans ces cles le backend
      # refuse de booter. AJOUTE ici (manquait dans ce compose alors que
      # .env.prod.example/guide les declarent requis). /!\ VERIFIER que la valeur
      # dans .env.prod == la cle de l'instance deja deployee, sinon les donnees
      # chiffrees existantes deviennent illisibles.
      - AT_REST_KEY=${AT_REST_KEY}
      - EMAIL_SEARCH_KEY=${EMAIL_SEARCH_KEY}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - internal
      - traefik-public
    depends_on:
      postgres:
        condition: service_healthy
    # ── Hardening ────────────────────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m
    # Chromium/Puppeteer (generation PDF) a besoin de /dev/shm dimensionne.
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    logging: *default-logging
    labels:
      - "traefik.docker.network=traefik-public"
      - "traefik.enable=true"
      - "traefik.http.routers.crm-backend-secure.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.crm-backend-secure.entrypoints=websecure"
      - "traefik.http.routers.crm-backend-secure.service=crm-backend"
      - "traefik.http.routers.crm-backend-secure.middlewares=secure-public-waf-app@file"
      - "traefik.http.services.crm-backend.loadbalancer.server.port=4000"

  postgres:
    image: postgres:16-alpine
    container_name: crm-commercial-postgres
    hostname: crm-commercial-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    # Pas de port expose — accessible uniquement depuis le network internal.
    # ── Hardening ────────────────────────────────────────────────────────────
    # Pas de read_only : Postgres ecrit dans des chemins runtime hors volume.
    # cap_add minimal : l'entrypoint chown les data + drop root -> postgres.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tuning leger pour petit serveur (ajuster selon la RAM Scaleway)
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=50

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true

volumes:
  postgres_data:
  backend_uploads:
